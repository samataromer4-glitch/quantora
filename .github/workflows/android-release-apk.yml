name: Build signed Quantora Android release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'index.html'
      - '.github/workflows/android-release-apk.yml'

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"; exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run required app checks
        run: |
          npm run lint
          npm run test:students-contract
          npm run test:attendance-contract
          npm run test:mobile-contract
          npm run build
          npm run build:mobile

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Synchronize Capacitor
        run: |
          npx cap sync android
          test -d android/app

      - name: Decode private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/quantora-release.jks
          chmod 600 android/app/quantora-release.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: quantora-android-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
