name: Quantora Security & Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Students production contract checks
        run: npm run test:students-contract

      - name: Attendance production contract checks
        run: npm run test:attendance-contract

      - name: Mobile authentication and configuration regression checks
        run: npm run test:mobile-contract

      - name: Build isolated mobile bundle
        run: npm run build:mobile


      - name: Production build
        run: npm run build

      - name: Runtime smoke test
        run: node scripts/server-smoke.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
